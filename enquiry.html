<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Artisan Crust Bakery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header and Navigation -->
    <header>
        <div class="logo">
            <h1>Artisan Crust Bakery</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content: Enquiry Form -->
    <main>
        <section class="form-section">
            <h2>Product or Service Enquiry</h2>
            <p>Fill out the form below to place a custom order or inquire about our offerings.</p>
            
            <form action="#" method="POST">
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="interest">Interested In:</label>
                    <select id="interest" name="interest">
                        <option value="sourdough">Artisan Sourdough</option>
                        <option value="pastries">Pastries</option>
                        <option value="custom-cake">Custom Celebration Cake</option>
                    </select>
                </div>
                <div>
                    <label for="message">Message / Details:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Artisan Crust Bakery. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
